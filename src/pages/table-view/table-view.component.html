<div class="flex flex-1 flex-col min-h-0 overflow-y-auto no-scrollbar">
  <div class="container mx-auto w-full p-4 space-y-3">
    @for (zone of data | async; track zone.id) {
      <hlm-collapsible [expanded]="true" class="rounded-xl bg-card">
        <button
          hlmCollapsibleTrigger
          type="button"
          class="flex w-full items-center justify-between gap-3 p-4 text-left transition-colors hover:bg-muted/50 [&[data-state=open]>ng-icon]:rotate-180"
        >
          <div class="flex items-center gap-3">
            <h2 class="font-bold text-lg">{{ zone.name }}</h2>
            <span class="text-xs text-muted-foreground px-2 py-1 rounded-full bg-muted">
              {{ zone.tables.length }} table(s)
            </span>
          </div>
          <ng-icon
            hlm
            name="lucideChevronDown"
            size="sm"
            class="shrink-0 transition-transform duration-200"
          />
        </button>

        <hlm-collapsible-content>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-4 pt-0">
            @for (t of zone.tables; track t.id) {
              <button
                type="button"
                class="group text-left p-4 rounded-xl border border-border bg-card transition-all hover:border-primary/50 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary/40"
                (click)="router.navigate(['new-client-order', t.id])"
              >
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h3 class="font-bold text-lg group-hover:text-primary transition-colors">
                      {{ t.name }}
                    </h3>
                    <p class="text-xs text-muted-foreground mt-0.5">{{ zone.name }}</p>
                  </div>
                  <span hlmBadge [variant]="getTableBadgeVariant(t.status)">
                    {{ getTableStatusLabel(t.status) }}
                  </span>
                </div>

                @if (getActiveOrder(t); as activeOrder) {
                  <div class="mt-4 pt-3 border-t border-border/60 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-xs text-muted-foreground">Commande</span>
                      <span hlmBadge [variant]="getOrderBadgeVariant(activeOrder.status)">
                        {{ getOrderStatusLabel(activeOrder.status) }}
                      </span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                      <span class="text-muted-foreground">Reste à payer</span>
                      <span class="font-bold text-destructive">
                        {{ formatAmount(getOrderRemaining(activeOrder)) }}
                      </span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-muted-foreground">
                      <span>Total</span>
                      <span>{{ formatAmount(activeOrder.total) }}</span>
                    </div>
                  </div>
                } @else {
                  <p class="mt-4 pt-3 border-t border-border/60 text-xs text-muted-foreground">
                    Aucune commande active
                  </p>
                }
              </button>
            }
          </div>
        </hlm-collapsible-content>
      </hlm-collapsible>
    }
  </div>
</div>
