@if (selectedFamily) {
  <div class="flex flex-col h-full p-3">
    <div class="rounded-xl border border-border bg-card shadow-sm flex flex-col h-full overflow-hidden">
      <div class="px-4 py-3 border-b border-border bg-muted/30">
        <h2 class="font-semibold text-sm text-center">{{ selectedFamily.name }}</h2>
        <p class="text-xs text-muted-foreground text-center mt-0.5">
          {{ selectedFamily.products.length }} produit(s)
        </p>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
          @for (product of selectedFamily.products; track trackByProductId($index, product)) {
            <button
              type="button"
              class="group p-3 rounded-xl border border-border bg-background transition-all hover:border-primary/50 hover:shadow-md hover:-translate-y-0.5 flex flex-col justify-between min-h-24 text-left"
              (click)="addToCart.emit(product)"
            >
              <p class="font-medium text-xs leading-tight line-clamp-2 group-hover:text-primary transition-colors">
                {{ product.name }}
              </p>
              <span class="mt-2 text-xs font-semibold px-2 py-1 rounded-md bg-primary/10 text-primary w-fit">
                {{ formatAmount(product.price) }}
              </span>
            </button>
          }
        </div>
      </div>
    </div>
  </div>
}
